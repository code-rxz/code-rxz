<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Simulación de agua</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #021a2b;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8f6ff;
  }
  /* El lienzo es pequeño (ej. 128x280 px) y el navegador lo estira a pantalla
     completa. Estirar es gratis para la CPU y suaviza la imagen. */
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none; /* evita que el dedo haga scroll o zoom */
  }
  #info {
    position: fixed;
    top: 8px;
    left: 10px;
    font-size: 12px;
    opacity: .75;
    pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  #ui {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(2, 26, 43, .8));
  }
  button {
    min-height: 44px;           /* tamaño cómodo para el dedo */
    padding: 0 14px;
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 22px;
    background: rgba(255, 255, 255, .12);
    color: inherit;
    font-size: 14px;
  }
  button[aria-pressed="true"] { background: rgba(80, 200, 255, .45); }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  input[type="range"] { width: 120px; }
</style>
</head>
<body>

<canvas id="agua"></canvas>
<div id="info"></div>

<div id="ui">
  <button id="btn-lluvia" aria-pressed="false">🌧️ Lluvia</button>
  <button id="btn-pausa">⏸️ Pausa</button>
  <button id="btn-limpiar">🧹 Limpiar</button>
  <button id="btn-calidad">⚙️ Calidad</button>
  <label>Duración de las olas
    <input type="range" id="rng-amort" min="0.97" max="0.999" step="0.001" value="0.99">
  </label>
</div>

<script>
/*
 * SIMULACIÓN DE AGUA 2D
 * ---------------------
 * Idea: el agua es una cuadrícula de "alturas". Cada celda sube o baja
 * según lo que hacen sus 4 vecinas (ecuación de onda discretizada).
 * Luego se dibuja usando la inclinación de la superficie para simular
 * refracción (el fondo se deforma) y reflejo de luz (brillos).
 *
 * Optimizaciones para móviles modestos:
 *  - Cuadrícula pequeña, estirada por CSS a pantalla completa.
 *  - Solo arrays tipados (Float32Array): sin crear objetos en el bucle.
 *  - Paso de tiempo fijo: la física va igual en 30 o 60 fps.
 *  - Si no hay olas, se deja de calcular y dibujar (ahorra batería).
 *  - Si el rendimiento es malo, baja la calidad sola.
 */
(() => {
  'use strict';

  /* ============ 1. CONFIGURACIÓN ============ */

  // Ancho de la cuadrícula en celdas, de mejor a peor calidad.
  const NIVELES = [160, 128, 100, 76];
  const NOMBRES = ['Alta', 'Media', 'Baja', 'Mínima'];

  const PASO_MS = 1000 / 60;       // la física avanza en pasos de 1/60 s
  const MAX_PASOS_POR_FRAME = 2;   // tope para no ahogar un móvil lento
  const REFRACCION = 0.8;          // cuánto se deforma el fondo con la pendiente
  const LIMITE_ALTURA = 30;        // evita que las olas crezcan sin control

  /* ============ 2. ESTADO ============ */

  const lienzo = document.getElementById('agua');
  const ctx = lienzo.getContext('2d', { alpha: false });
  const info = document.getElementById('info');

  let nivel = 1;                   // empieza en "Media"
  let W = 0, H = 0, N = 0;         // ancho, alto y total de celdas
  let actual, previo;              // alturas ahora y un paso antes
  let fondo;                       // colores del fondo de la piscina (RGB)
  let imagen;                      // píxeles que se dibujan
  let aspectoUsado = 1;

  let amort = 0.99;                // 1 = olas eternas, menor = se apagan antes
  let lluvia = false;
  let pausa = false;
  let pasosActivos = 0;            // cuántos pasos faltan para considerar el agua en calma

  // Medición de rendimiento
  let acumMs = 0, cuadros = 0, calentar = 0, fps = 0;

  /* ============ 3. PREPARAR LA CUADRÍCULA ============ */

  function iniciar(nuevoNivel) {
    nivel = nuevoNivel;
    W = NIVELES[nivel];
    // Mantenemos la proporción de la pantalla para que las olas sean circulares.
    H = Math.min(420, Math.max(40, Math.round(W * innerHeight / innerWidth)));
    N = W * H;
    aspectoUsado = innerWidth / innerHeight;

    lienzo.width = W;
    lienzo.height = H;

    actual = new Float32Array(N);
    previo = new Float32Array(N);

    crearFondo();
    imagen = ctx.createImageData(W, H);
    // Rellenamos toda la imagen con el fondo. Más tarde solo repintamos el
    // interior, así los bordes (que son "paredes") quedan siempre bien.
    for (let i = 0; i < N; i++) {
      imagen.data[i * 4]     = fondo[i * 3];
      imagen.data[i * 4 + 1] = fondo[i * 3 + 1];
      imagen.data[i * 4 + 2] = fondo[i * 3 + 2];
      imagen.data[i * 4 + 3] = 255;
    }

    calentar = 30;                 // ignoramos los primeros cuadros al medir fps
    acumMs = 0; cuadros = 0;

    pintar();
    ctx.putImageData(imagen, 0, 0);
    gota(W / 2, H / 2, 5, 12);     // una gota inicial para que se vea vivo
    actualizarInfo();
  }

  // El fondo de la piscina: degradado azul con baldosas.
  // Se calcula UNA vez; después solo se "consulta" con desplazamiento.
  function crearFondo() {
    fondo = new Uint8ClampedArray(N * 3);
    const celda = Math.max(8, Math.round(W / 10));
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 3;
        const prof = (x / W) * 0.4 + (y / H) * 0.6;   // 0 = poco profundo, 1 = profundo
        let r = 20 + 30 * (1 - prof);
        let g = 120 + 60 * (1 - prof);
        let b = 170 + 50 * (1 - prof);
        if (((x / celda | 0) + (y / celda | 0)) & 1) { r -= 8; g -= 8; b -= 8; }
        if (x % celda < 1 || y % celda < 1) { r += 60; g += 60; b += 50; }  // juntas
        fondo[i] = r; fondo[i + 1] = g; fondo[i + 2] = b;
      }
    }
  }

  /* ============ 4. FÍSICA ============ */

  /*
   * Ecuación de onda discretizada:
   *
   *   h_nueva = ( suma_de_las_4_vecinas / 2  -  h_anterior ) * amortiguación
   *
   * Sale de: h_nueva = 2h - h_anterior + C * (suma_vecinas - 4h)
   * con C = 0.5, que es el valor máximo estable en 2D (condición CFL).
   * Con C = 0.5 los "2h" se cancelan y queda la fórmula corta de arriba.
   *
   * El truco de memoria: guardamos el resultado en el array "previo"
   * (que ya no necesitamos) y luego intercambiamos los dos arrays.
   * Así no se crea ni se copia nada en cada paso.
   */
  function paso() {
    const a = actual, p = previo, d = amort;
    for (let y = 1; y < H - 1; y++) {
      let i = y * W + 1;
      for (let x = 1; x < W - 1; x++, i++) {
        p[i] = ((a[i - 1] + a[i + 1] + a[i - W] + a[i + W]) * 0.5 - p[i]) * d;
      }
    }
    previo = a;
    actual = p;
  }

  // Una gota: hunde la superficie con forma de campana suave (coseno).
  function gota(cx, cy, radio, fuerza) {
    const x0 = Math.max(1, Math.floor(cx - radio));
    const x1 = Math.min(W - 2, Math.ceil(cx + radio));
    const y0 = Math.max(1, Math.floor(cy - radio));
    const y1 = Math.min(H - 2, Math.ceil(cy + radio));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dist = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
        if (dist < radio) {
          const i = y * W + x;
          const v = actual[i] - fuerza * 0.5 * (1 + Math.cos(Math.PI * dist / radio));
          actual[i] = Math.max(-LIMITE_ALTURA, Math.min(LIMITE_ALTURA, v));
        }
      }
    }
    despertar();
  }

  function gotaAleatoria() {
    gota(2 + Math.random() * (W - 4), 2 + Math.random() * (H - 4), 2 + Math.random() * 1.5, 5);
  }

  // Cuántos pasos tarda el agua en calmarse según la amortiguación.
  // (ln 1000 ≈ 7: la amplitud baja a la milésima parte)
  function despertar() {
    pasosActivos = Math.min(3600, Math.ceil(7 / -Math.log(amort)));
  }

  /* ============ 5. DIBUJO ============ */

  /*
   * Para cada píxel miramos la pendiente de la superficie:
   *   dx = altura(derecha) - altura(izquierda)
   *   dy = altura(abajo)   - altura(arriba)
   *
   * 1) Refracción: la pendiente desplaza el punto del fondo que "vemos".
   * 2) Luz: una luz imaginaria arriba a la izquierda ilumina las pendientes
   *    que miran hacia ella (más claro) y oscurece las contrarias.
   * 3) Brillo especular: si la pendiente apunta casi directo a la luz,
   *    se añade un destello blanco.
   */
  function pintar() {
    const a = actual, px = imagen.data, f = fondo;
    const maxX = W - 1, maxY = H - 1;
    for (let y = 1; y < maxY; y++) {
      let i = y * W + 1;
      for (let x = 1; x < maxX; x++, i++) {
        const dx = a[i + 1] - a[i - 1];
        const dy = a[i + W] - a[i - W];

        let u = (x + dx * REFRACCION) | 0;
        let v = (y + dy * REFRACCION) | 0;
        if (u < 0) u = 0; else if (u > maxX) u = maxX;
        if (v < 0) v = 0; else if (v > maxY) v = maxY;
        const s = (v * W + u) * 3;

        const luz = -(dx + dy);
        let brillo = luz * 5;
        if (luz > 3) brillo += (luz - 3) * 28;

        const o = i * 4;
        px[o]     = f[s]     + brillo;   // Uint8ClampedArray limita a 0-255 solo
        px[o + 1] = f[s + 1] + brillo;
        px[o + 2] = f[s + 2] + brillo;
      }
    }
  }

  /* ============ 6. BUCLE PRINCIPAL ============ */

  let ultimo = 0, acum = 0;

  function frame(t) {
    requestAnimationFrame(frame);
    if (!ultimo) ultimo = t;
    let dt = t - ultimo;
    ultimo = t;
    if (dt > 100) dt = 100;        // por si la pestaña estuvo en segundo plano

    if (pausa || pasosActivos <= 0) return;   // agua en calma: no gastamos nada

    acum += dt;
    let n = 0;
    while (acum >= PASO_MS && n < MAX_PASOS_POR_FRAME) {
      if (lluvia && Math.random() < 0.12) gotaAleatoria();
      paso();
      pasosActivos--;
      acum -= PASO_MS;
      n++;
    }
    if (acum > PASO_MS) acum = 0;  // si vamos atrasados, no acumulamos deuda

    pintar();
    ctx.putImageData(imagen, 0, 0);
    medir(dt);
  }

  /* ============ 7. CALIDAD AUTOMÁTICA ============ */

  // Cada 90 cuadros dibujados calculamos el tiempo medio.
  // Si es peor que ~25 fps, bajamos un nivel de calidad.
  function medir(dt) {
    if (calentar > 0) { calentar--; return; }
    if (dt > 60) return;           // cuadro raro (pausa, cambio de pestaña): se ignora
    acumMs += dt; cuadros++;
    if (cuadros >= 90) {
      const promedio = acumMs / cuadros;
      fps = Math.round(1000 / promedio);
      acumMs = 0; cuadros = 0;
      if (promedio > 40 && nivel < NIVELES.length - 1) {
        iniciar(nivel + 1);
      } else {
        actualizarInfo();
      }
    }
  }

  function actualizarInfo() {
    info.textContent = NOMBRES[nivel] + ' · ' + W + '×' + H + (fps ? ' · ' + fps + ' fps' : '');
  }

  /* ============ 8. CONTROLES ============ */

  const punteros = new Set();

  function aCuadricula(e) {
    const r = lienzo.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
  }

  lienzo.addEventListener('pointerdown', (e) => {
    lienzo.setPointerCapture(e.pointerId);
    punteros.add(e.pointerId);
    const [x, y] = aCuadricula(e);
    gota(x, y, 4, 10);             // toque = gota fuerte
  });
  lienzo.addEventListener('pointermove', (e) => {
    if (!punteros.has(e.pointerId)) return;
    const [x, y] = aCuadricula(e);
    gota(x, y, 3, 3);              // arrastrar = estela de olas suaves
  });
  const soltar = (e) => punteros.delete(e.pointerId);
  lienzo.addEventListener('pointerup', soltar);
  lienzo.addEventListener('pointercancel', soltar);

  const btnLluvia = document.getElementById('btn-lluvia');
  btnLluvia.addEventListener('click', () => {
    lluvia = !lluvia;
    btnLluvia.setAttribute('aria-pressed', lluvia);
    if (lluvia) despertar();
  });

  const btnPausa = document.getElementById('btn-pausa');
  btnPausa.addEventListener('click', () => {
    pausa = !pausa;
    btnPausa.textContent = pausa ? '▶️ Seguir' : '⏸️ Pausa';
  });

  document.getElementById('btn-limpiar').addEventListener('click', () => {
    actual.fill(0);
    previo.fill(0);
    pintar();
    ctx.putImageData(imagen, 0, 0);
  });

  document.getElementById('btn-calidad').addEventListener('click', () => {
    iniciar((nivel + 1) % NIVELES.length);
  });

  document.getElementById('rng-amort').addEventListener('input', (e) => {
    amort = parseFloat(e.target.value);
    despertar();
  });

  // Al girar el móvil o cambiar mucho la proporción, rehacemos la cuadrícula.
  // (Si solo se oculta la barra del navegador, no hace falta.)
  let temporizador;
  addEventListener('resize', () => {
    clearTimeout(temporizador);
    temporizador = setTimeout(() => {
      const asp = innerWidth / innerHeight;
      if (Math.abs(asp / aspectoUsado - 1) > 0.15) iniciar(nivel);
    }, 250);
  });

  /* ============ 9. ARRANQUE ============ */
  iniciar(nivel);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
